<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>主动消息日程判断</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><div><p class="eyebrow">主动消息 · 发送前检查</p><h1>先看你有没有空</h1><p class="muted">结合本轮聊天和长期记忆，明确忙碌才跳过。无法确定时照常发送。</p></div><button id="refresh">刷新记录</button></header>
  <div id="notice" role="status" aria-live="polite">正在连接…</div>
  <section class="cards"><article><span>日程拦截</span><strong id="enabled">—</strong><small id="model">—</small></article><article><span>因忙碌跳过</span><strong id="skipped">—</strong><small>真实触发，不含模拟检查</small></article><article><span>确认已发送</span><strong id="sent">—</strong><small>根据实际发送标记确认</small></article></section>
  <section class="panel"><h2>下一次主动检查</h2><div id="next">—</div></section>
  <section class="panel"><h2>模拟一个时间</h2><p class="muted">只运行判断，不生成正式消息、不调用语音、不向 QQ 发送。</p><div class="form"><label>私聊会话<select id="session"></select></label><label>北京时间<input id="at" type="datetime-local"></label><button id="check" class="primary">模拟检查</button><button id="bootstrap">保存并验证已有文字日程</button></div><div id="simulation" aria-live="polite"></div></section>
  <section class="panel"><h2>检查记录</h2><p class="muted">“已放行”不代表已经发送。展开一条记录可查看判断依据。</p><div id="records"></div></section>
</main><script defer src="app.js"></script></body></html>
